<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AI Plays Pokemon — live</title>
<script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/htm@3.1.1/dist/htm.umd.js"></script>
<style>
  :root {
    --bg: #0d1117; --panel: #161b22; --panel2: #1c2330; --line: #2d3646;
    --text: #dbe2ea; --dim: #8b96a5; --accent: #58a6ff; --good: #3fb950;
    --bad: #f85149; --warn: #d29922; --battle: #bc8cff;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--text);
    font: 14px/1.45 ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  }
  #root { display: flex; flex-direction: column; height: 100vh; }
  header {
    display: flex; align-items: center; gap: 14px; padding: 10px 16px;
    background: var(--panel); border-bottom: 1px solid var(--line);
  }
  header h1 { font-size: 15px; margin: 0; font-weight: 600; }
  header .file { color: var(--dim); font-size: 12px; }
  header .dot {
    width: 9px; height: 9px; border-radius: 50%; background: var(--good);
    animation: pulse 2s infinite;
  }
  @keyframes pulse { 50% { opacity: .35; } }
  main { display: flex; flex: 1; min-height: 0; }
  .left {
    width: 420px; min-width: 320px; padding: 14px; display: flex;
    flex-direction: column; gap: 12px; border-right: 1px solid var(--line);
    background: var(--panel);
  }
  .screen {
    background: #000; border: 1px solid var(--line); border-radius: 8px;
    overflow: hidden; line-height: 0;
  }
  .screen img { width: 100%; image-rendering: pixelated; }
  .stats { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .stat {
    background: var(--panel2); border: 1px solid var(--line);
    border-radius: 8px; padding: 8px 10px;
  }
  .stat .k { color: var(--dim); font-size: 11px; text-transform: uppercase; }
  .stat .v { font-size: 15px; margin-top: 2px; word-break: break-all; }
  .feed { flex: 1; overflow-y: auto; padding: 14px; }
  .turn {
    background: var(--panel); border: 1px solid var(--line);
    border-radius: 10px; padding: 10px 14px; margin-bottom: 10px;
  }
  .turn.battle { border-left: 3px solid var(--battle); }
  .turn .head {
    display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap;
  }
  .turn .n { color: var(--accent); font-weight: 700; }
  .turn .map { color: var(--dim); font-size: 12px; }
  .badge {
    font-size: 10px; padding: 1px 7px; border-radius: 10px;
    border: 1px solid var(--battle); color: var(--battle);
  }
  .action { margin-top: 6px; }
  .action .verb { color: var(--warn); font-weight: 600; }
  .result { color: var(--dim); margin-top: 2px; white-space: pre-wrap; }
  .result.ok { color: var(--good); }
  .result.fail { color: var(--bad); }
  .think {
    margin-top: 6px; color: var(--dim); font-style: italic;
    white-space: pre-wrap; font-size: 12.5px;
  }
  details { margin-top: 8px; }
  summary { color: var(--accent); cursor: pointer; font-size: 12px; }
  pre.report {
    background: var(--panel2); border: 1px solid var(--line);
    border-radius: 8px; padding: 10px; overflow-x: auto; font-size: 12px;
    white-space: pre-wrap;
  }
  .pick { margin-top: 6px; font-size: 12.5px; color: var(--battle);
          white-space: pre-wrap; }
  .empty { color: var(--dim); text-align: center; margin-top: 40vh; }
  @media (max-width: 900px) {
    main { flex-direction: column; }
    .left { width: 100%; flex-direction: row; border-right: 0;
            border-bottom: 1px solid var(--line); }
    .screen { width: 50%; }
    .stats { flex: 1; }
  }
</style>
</head>
<body>
<div id="root"></div>
<script>
const { useState, useEffect, useRef } = React;
const html = htm.bind(React.createElement);

function parseReply(reply) {
  const think = (reply.match(/THINK:\s*([^\n]*)/i) || [])[1] || "";
  return think.trim();
}
function pickLine(report) {
  const m = (report || "").match(/CALCULATOR'S PICK:[^\n]*/);
  return m ? m[0] : "";
}
function lastOf(turns, fn, fallback) {
  for (let i = turns.length - 1; i >= 0; i--) {
    const v = fn(turns[i]);
    if (v !== undefined && v !== null && v !== "") return v;
  }
  return fallback;
}

function Turn({ t }) {
  const think = parseReply(t.reply || "");
  const pick = t.in_battle ? pickLine(t.report) : "";
  const failed = /didn't work|stuck|blocked|not respond|no route/i
    .test(t.result || "");
  const good = /arrived|healed|bought|fled|caught|named/i.test(t.result || "");
  return html`
    <div class=${"turn" + (t.in_battle ? " battle" : "")}>
      <div class="head">
        <span class="n">#${t.turn}</span>
        ${t.in_battle && html`<span class="badge">BATTLE</span>`}
        <span class="map">${t.map || ""} ${t.tile ? JSON.stringify(t.tile) : ""}</span>
      </div>
      ${think && html`<div class="think">${think}</div>`}
      <div class="action">→ <span class="verb">${t.action || "?"}</span></div>
      <div class=${"result" + (failed ? " fail" : good ? " ok" : "")}>
        ${t.result || ""}</div>
      ${pick && html`<div class="pick">${pick}</div>`}
      <details>
        <summary>what the model saw</summary>
        <pre class="report">${t.report || ""}</pre>
      </details>
    </div>`;
}

function App() {
  const [turns, setTurns] = useState([]);
  const [file, setFile] = useState("");
  const [frameKey, setFrameKey] = useState(0);
  const seen = useRef(0);
  const feedRef = useRef(null);
  const pinned = useRef(true);

  useEffect(() => {
    const poll = async () => {
      try {
        const r = await fetch(`/api/turns?since=${seen.current}`);
        const d = await r.json();
        if (d.file !== file && file !== "") { seen.current = 0; setTurns([]); }
        setFile(d.file || "");
        if (d.total < seen.current) { seen.current = 0; setTurns(d.turns); }
        else if (d.turns.length) {
          setTurns((prev) => prev.concat(d.turns));
        }
        seen.current = d.total;
      } catch (e) { /* server restarting; keep polling */ }
      setFrameKey((k) => k + 1);
    };
    poll();
    const id = setInterval(poll, 1500);
    return () => clearInterval(id);
  }, [file]);

  useEffect(() => {
    const el = feedRef.current;
    if (el && pinned.current) el.scrollTop = el.scrollHeight;
  }, [turns]);

  const onScroll = () => {
    const el = feedRef.current;
    pinned.current = el.scrollHeight - el.scrollTop - el.clientHeight < 60;
  };

  const last = turns[turns.length - 1] || {};
  const money = lastOf(turns,
    (t) => (t.report.match(/Money:\s*(\$[\d,]+)/) || [])[1], "—");
  const objective = lastOf(turns,
    (t) => (t.report.match(/YOUR OBJECTIVE[^:]*:\s*([^\n]+)/) || [])[1], "—");
  const party = lastOf(turns,
    (t) => (t.report.match(/^\s*1\.\s*([^\n]+)$/m) || [])[1], "—");

  return html`
    <header>
      <div class="dot"></div>
      <h1>AI Plays Pokemon</h1>
      <span class="file">${file || "waiting for a run…"} · turn ${last.turn ?? "—"}</span>
    </header>
    <main>
      <div class="left">
        <div class="screen">
          <img src=${"/frame.png?k=" + frameKey} alt="game frame" />
        </div>
        <div class="stats">
          <div class="stat"><div class="k">objective</div>
            <div class="v">${objective}</div></div>
          <div class="stat"><div class="k">party</div>
            <div class="v">${party}</div></div>
          <div class="stat"><div class="k">money</div>
            <div class="v">${money}</div></div>
          <div class="stat"><div class="k">where</div>
            <div class="v">${last.map || "—"}</div></div>
        </div>
      </div>
      <div class="feed" ref=${feedRef} onScroll=${onScroll}>
        ${turns.length === 0 && html`<div class="empty">no turns yet</div>`}
        ${turns.map((t) => html`<${Turn} key=${t.turn + (t.time || "")} t=${t} />`)}
      </div>
    </main>`;
}

ReactDOM.createRoot(document.getElementById("root")).render(html`<${App} />`);
</script>
</body>
</html>
